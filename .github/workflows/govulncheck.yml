name: Go vulnerability scan

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "1"
          - ConfigGen
          - JsonValidator
          - SlickTools
          - Zabbix-Client
          - ad-password-reset-telegram
          - bitwardern-sdk
          - jenkins-client
          - mkvmerge-consumer
          - mkvmerge-notifier
          - slick-auth
          - slick-autobuild
          - telegram-torrent-bot
          - templ-engine
          - url-extractor
          - web-to-pdf
          - website-checke-v2
          - website-checker

    steps:
      - uses: actions/checkout@v7
      - name: Scan ${{ matrix.module }}
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"
          go-package: ./...
          work-dir: ${{ matrix.module }}
          repo-checkout: false
          cache: false
